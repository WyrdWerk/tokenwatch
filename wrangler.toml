# Minimal Wrangler Pages configuration for TokenWatch.
#
# This file exists ONLY to give the Pages Function a *local* D1 binding for
# price-history development and tests. It intentionally declares no remote
# database, no account id, and no deployment settings:
#
#   - `wrangler pages dev public` starts a local Pages server that serves
#     public/ and runs functions/, with PRICE_HISTORY bound to the local
#     .wrangler/state D1 database created by `wrangler d1 migrations apply`.
#   - No production/preview D1 database, binding, or credential is configured
#     here. Adding those is a separate, explicitly-approved rollout step.
#
# See migrations/README.md for the local workflow.

name = "payg-inference-calculator"
pages_build_output_dir = "public"
compatibility_date = "2026-09-01"

[[d1_databases]]
binding = "PRICE_HISTORY"
database_name = "tokenwatch-price-history"
# Placeholder id: Wrangler only substitutes this for REMOTE (--remote) access.
# Local `wrangler pages dev` resolves the binding from .wrangler/state using
# database_name, so no real Cloudflare database id is required or recorded here.
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"