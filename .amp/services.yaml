services:
  web:
    command: node .agents/build-preview.mjs && serve .amp/preview -l tcp://0.0.0.0:"$PORT" --config "$PWD/.agents/preview-serve.json"
    health: /
    portal:
      title: TokenWatch
      description: Preview snapshot of public/ with combined text-page scripts. Restart web after source edits to rebuild. Production assets and committed catalogs are unchanged; API Functions are not served here.
  bb-pilot:
    command: bash .agents/bb-service.sh
    cwd: .
    health: /health
    env:
      BB_TELEMETRY: "false"
      BB_SERVER_BIND_HOST: "127.0.0.1"
    portal:
      url: /
      title: TokenWatch bb
      description: Loopback-only bb-app 0.43.0 workspace; state is isolated per AMP_THREAD_ID and telemetry is disabled.
    review: false
    agent: off
