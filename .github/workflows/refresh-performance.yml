name: Refresh Performance

concurrency:
  group: repo-refresh
  cancel-in-progress: false

on:
  schedule:
    # every 2 hours at minute 30 (offset from pricing refresh at 00:00)
    # RE-ARM 2026-08-31: GitHub stopped delivering schedule events for this
    # workflow (data stalled >5h). Re-registering the cron; see session fix.
    - cron: '30 */2 * * *'
  workflow_dispatch:
    inputs:
      force:
        type: boolean
        default: false
        description: 'Deploy even when nothing changed (recovery lever after a failed deploy)'

permissions:
  contents: write

jobs:
  perf:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Mint data-bot token
        id: token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.DATA_BOT_APP_ID }}
          private-key: ${{ secrets.DATA_BOT_PRIVATE_KEY }}

      - name: Configure push remote
        run: git remote set-url origin "https://x-access-token:${{ steps.token.outputs.token }}@github.com/${{ github.repository }}"

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run tests
        env:
          TW_PARITY_LIVE: '0'
        run: node --test test/*.test.mjs

      - name: Fetch performance data
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: node scripts/fetch-performance.mjs

      - name: Commit performance data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/performance.json
          if git diff --cached --quiet; then
            echo "No performance changes — skipping commit and deploy."
          else
            git commit -m "chore: refresh performance data ($(date -u +%Y-%m-%dT%H:%M) UTC)"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
        id: commit

      - name: Generate SEO
        if: steps.commit.outputs.changed == 'true' || github.event.inputs.force == 'true'
        run: node scripts/generate-seo.mjs

      - name: Verify generated SEO surface
        if: steps.commit.outputs.changed == 'true' || github.event.inputs.force == 'true'
        run: node scripts/verify-seo.mjs

      - name: Bust cache (content-hashed asset paths)
        if: steps.commit.outputs.changed == 'true' || github.event.inputs.force == 'true'
        run: node scripts/bust-cache.mjs

      - name: Minify JSON
        if: steps.commit.outputs.changed == 'true' || github.event.inputs.force == 'true'
        run: node scripts/minify-json.mjs

      - name: Deploy to Cloudflare Pages
        if: steps.commit.outputs.changed == 'true' || github.event.inputs.force == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy public --project-name payg-inference-calculator --branch main

      - name: Verify hashed asset content-type (guards the 2026-07-30 SPA-fallback outage)
        if: steps.commit.outputs.changed == 'true' || github.event.inputs.force == 'true'
        run: |
          set -u
          first="$(ls public/h/*.js 2>/dev/null | head -n 1)"
          file="${first##*/}"
          if [ -z "$file" ]; then echo "no hashed JS in public/h/ — did bust-cache run?"; exit 1; fi
          origins="https://payg-inference-calculator.pages.dev https://tokenwatch.wyrdwerk.com"
          for origin in $origins; do
            ok=0
            for attempt in $(seq 1 12); do
              ct="$(curl -sSI "${origin}/h/${file}" | grep -i '^content-type:' | tr -d '\r' | awk '{print $2}')"
              echo "attempt ${attempt}/12 ${origin} /h/${file} → content-type: ${ct:-<empty>}"
              if [ "$ct" = "application/javascript" ]; then ok=1; break; fi
              sleep 5
            done
            if [ "$ok" -ne 1 ]; then echo "FAIL: ${origin}/h/${file} never served application/javascript after 12 attempts (last: ${ct:-empty})"; exit 1; fi
          done

      # Deploy is explicit (not relying on push-triggered refresh-pricing.yml deploy)
      # because GITHUB_TOKEN pushes do not trigger downstream workflow runs.
